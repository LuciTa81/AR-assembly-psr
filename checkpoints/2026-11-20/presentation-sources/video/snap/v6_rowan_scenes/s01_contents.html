<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../kit.css">
<style>
#ph{left:0;top:0;width:575px;height:1080px;overflow:hidden}
#ph img{width:100%;height:100%;object-fit:cover;transform-origin:50% 60%}
.kicker{left:690px}.title{left:690px}.sub{left:692px}
.row{left:690px;width:1120px;height:96px;border-radius:16px;border:1.5px solid transparent}
.row .n{position:absolute;left:26px;top:16px;font-size:52px;font-weight:300;color:#B9C6D8;line-height:1}
.row .h{position:absolute;left:124px;top:16px;font-size:30px;font-weight:800;color:#9AA3B2;white-space:nowrap}
.row .d{position:absolute;left:124px;top:57px;font-size:19px;color:#AEB6C3;font-weight:500;white-space:nowrap}
</style></head>
<body><div id="stage">
<div class="a" id="ph"><img src="../assets/contents.jpg"></div>
<div id="rows"></div>
</div>
<script src="../vo_data.js"></script><script src="../kit.js"></script>
<script>
KIT.build();
KIT.header({kicker:'Contents', title:'여섯 부분으로 나눠 설명합니다'});
const R=[['01','프로젝트 배경과 개요','개발 동기, 기존 방식과 비교, 개요'],['02','시스템 구성과 과제','전체 아키텍처, 풀어야 했던 세 가지 문제'],
 ['03','문제 1 · 단계 인식','데이터와 모델, 비교 실험, 나사 A로 따라가기'],['04','문제 2 · 양안 정합','보정과 확인, 눈별 투영'],
 ['05','문제 3 · 가림과 복구','추적과 진행의 분리, 시연 기록으로 확인'],['06','시연, 결과와 가치','실제 시연, 검증 결과, 기대효과, 후속 연구와 상업적 가치']];
R.forEach((r,i)=>{ const e=document.createElement('div'); e.className='a row'; e.id='r'+i; e.style.top=(286+i*110)+'px';
  e.innerHTML=`<div class="n">${r[0]}</div><div class="h">${r[1]}</div><div class="d">${r[2]}</div>`; $('stage').insertBefore(e,$('cap')); });
KIT.capX=1247;
const T = KIT.timeline([
  {k:'a', t:'영상은 여섯 부분입니다. 배경과 시스템 구성을 먼저 보고,', at:1.3},
  {k:'d', t:'단계 인식, 양안 정합, 가림과 복구 세 문제를 설명한 뒤,'},
  {k:'e', t:'시연과 결과, 기대효과로 마무리합니다.'},
],{tail:1.6});
const a=T.a, d=T.d; const ON=[a[0]+(a[1]-a[0])*0.42, a[0]+(a[1]-a[0])*0.62, d[0]+0.1, d[0]+(d[1]-d[0])*0.3, d[0]+(d[1]-d[0])*0.55, T.e[0]];
window.SCENE = t=>{
  const k=ss(t/KIT.dur); $('ph').querySelector('img').style.transform=`scale(${1.08-0.06*k}) translateY(${-10*k}px)`;
  show('ph',t,0,0.8,0,-30);
  R.forEach((r,i)=>{ const e=$('r'+i); show(e,t,0.9+i*0.12,0.5,14);
    const on=ramp(t,ON[i],0.35);
    const actv = (i===5) ? (t>=ON[5]) : (i>=2 && i<=4 ? (t>=ON[i] && t<T.e[0]) : (t>=ON[i] && t<(i===1?d[0]:ON[i+1])));
    e.style.background = actv ? 'rgba(255,255,255,.95)' : 'transparent';
    e.style.borderColor = actv ? '#38577D' : 'transparent';
    e.style.boxShadow = actv ? '0 10px 28px rgba(56,87,125,.16)' : 'none';
    e.querySelector('.n').style.color = on>0.5 ? '#38577D' : '#B9C6D8';
    e.querySelector('.h').style.color = `rgb(${lerp(154,31,on)},${lerp(163,39,on)},${lerp(178,51,on)})`;
    e.querySelector('.d').style.color = `rgb(${lerp(174,107,on)},${lerp(182,114,on)},${lerp(195,128,on)})`;
  });
};
</script></body></html>
