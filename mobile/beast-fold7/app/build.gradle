plugins { id 'com.android.application' }
android {
    namespace 'com.lucita.beastgate'
    compileSdk 36
    buildFeatures { buildConfig true }
    testBuildType project.findProperty('trackingTestBuildType') ?: 'debug'
    // Keep installed-app updates independent of the shell's ANDROID_USER_HOME.
    signingConfigs { debug { storeFile rootProject.file('.android/debug.keystore') } }
    defaultConfig {
        applicationId 'com.lucita.beastgate'
        minSdk 36
        targetSdk 36
        versionCode 12
        versionName '1.4.2'
        buildConfigField 'boolean', 'PARTIAL_MARKER_CANDIDATE', 'false'
        manifestPlaceholders = [appLabel: 'AR Assembly']
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        trackingCandidate {
            initWith debug
            applicationIdSuffix '.trackingcandidate'
            versionNameSuffix '-partial-markers-c3.2'
            buildConfigField 'boolean', 'PARTIAL_MARKER_CANDIDATE', 'true'
            manifestPlaceholders = [appLabel: 'AR Assembly Tracking']
            matchingFallbacks = ['debug']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    // 5.5.x requires compileSdk 37; 5.4.0 supports this app's unchanged SDK 36.
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'com.herohan:UVCAndroid:1.0.13'
    implementation 'org.opencv:opencv:4.14.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'junit:junit:4.13.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:5.4.0'
    testImplementation 'com.squareup.okhttp3:okhttp-tls:5.4.0'
}
